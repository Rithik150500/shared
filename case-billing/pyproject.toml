[project]
name = "case-billing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "data-access",
  "whatsapp-delivery",
  "rq>=1.16",
  "sentry-sdk>=2.0",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "freezegun"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["case_billing"]
