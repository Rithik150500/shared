[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-access"
version = "0.1.0"
description = "Shared data layer for Nowlez × Munshi unification"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "sentry-sdk>=1.40,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "testcontainers>=4.0"]
