          नया न्यायालय: *{{2}}*
          पिछला न्यायालय: {{3}}

          अद्यतन केस विवरण अब Nowlez पर उपलब्ध है।
        buttons:
          - { type: url, text: "Nowlez में देखें", url: "https://app.nowlez.in/cases/{{1}}" }
