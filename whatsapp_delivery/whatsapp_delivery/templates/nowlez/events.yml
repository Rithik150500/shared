          New court: *{{2}}*
          Previous court: {{3}}

          Updated case details are now on Nowlez.
        buttons:
          - { type: url, text: "Open in Nowlez", url: "https://app.nowlez.in/cases/{{1}}" }
        variables:
          - { name: case_title, position: 1, location: body }
          - { name: new_court, position: 2, location: body }
          - { name: old_court, position: 3, location: body }
          - { name: case_id, position: 4, location: button_url }
      hi:
