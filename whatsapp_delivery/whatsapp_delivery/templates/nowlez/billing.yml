# Nowlez billing / subscription-lifecycle templates (UTILITY).
#
# Sent by case_billing (trial / fallback / subscriptions / cancellation /
# webhook_router) and casepilot crons/nowlez_trial.py via
# enqueue_send_template(brand="nowlez", variables={...}). Variable NAMES below
# MUST match the dict keys the senders pass — the worker resolves
# variables[v.name] through body_variables_in_order() (worker.py:620).
#
# 7 distinct templates × {en_US, hi} = 14 filings. Body-only (no buttons) to
# keep approval simple; add CTAs later if wanted. Category UTILITY
# (transactional account/billing state); Meta may auto-recategorise on review.
templates:
  # 12. trial_started — fired by case_billing.nowlez.trial.create_trial_for_new_signup
  - name: trial_started_v1
    full_name: nowlez_trial_started_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Hi *{{1}}*, your Nowlez free trial has started — you have *{{2}} days* of full access to case tracking and WhatsApp alerts. We'll notify you here whenever your cases update.
        variables:
          - { name: name, position: 1, location: body }
          - { name: trial_days, position: 2, location: body }
      hi:
        body: |
          नमस्ते *{{1}}*, आपका Nowlez निःशुल्क ट्रायल शुरू हो गया है — आपके पास *{{2}} दिन* तक केस ट्रैकिंग और WhatsApp अलर्ट की पूरी सुविधा है। जब भी आपके केसों में अपडेट होगा, हम आपको यहीं सूचित करेंगे।
        variables:
          - { name: name, position: 1, location: body }
          - { name: trial_days, position: 2, location: body }

  # 13. trial_ending — casepilot crons/nowlez_trial.py reminder
  - name: trial_ending_v1
    full_name: nowlez_trial_ending_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Your Nowlez trial ends in *{{1}} days* (on {{2}}). Add a plan to keep your case tracking and alerts running without interruption.
        variables:
          - { name: days_remaining, position: 1, location: body }
          - { name: trial_ends_at, position: 2, location: body }
      hi:
        body: |
          आपका Nowlez ट्रायल *{{1}} दिनों* में समाप्त हो रहा है ({{2}} को)। बिना रुकावट केस ट्रैकिंग और अलर्ट जारी रखने के लिए एक प्लान जोड़ें।
        variables:
          - { name: days_remaining, position: 1, location: body }
          - { name: trial_ends_at, position: 2, location: body }

  # 14. trial_fallback — case_billing.nowlez.fallback (graceful trial end)
  - name: trial_fallback_v1
    full_name: nowlez_trial_fallback_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Your Nowlez trial has ended. Your *{{1}} tracked cases* are safe — add a plan anytime to resume live updates and alerts.
        variables:
          - { name: case_count, position: 1, location: body }
      hi:
        body: |
          आपका Nowlez ट्रायल समाप्त हो गया है। आपके *{{1}} ट्रैक किए गए केस* सुरक्षित हैं — लाइव अपडेट और अलर्ट फिर से शुरू करने के लिए कभी भी एक प्लान जोड़ें।
        variables:
          - { name: case_count, position: 1, location: body }

  # 15. trial_ended_no_billing — case_billing.nowlez.fallback.freeze_account (no vars)
  - name: trial_ended_no_billing_v1
    full_name: nowlez_trial_ended_no_billing_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Your Nowlez trial has ended and your account is paused. Add a plan anytime to resume case tracking and WhatsApp alerts.
        variables: []
      hi:
        body: |
          आपका Nowlez ट्रायल समाप्त हो गया है और आपका खाता रोक दिया गया है। केस ट्रैकिंग और WhatsApp अलर्ट फिर से शुरू करने के लिए कभी भी एक प्लान जोड़ें।
        variables: []

  # 16. subscription_started — case_billing.shared.webhook_router (Razorpay activate)
  - name: subscription_started_v1
    full_name: nowlez_subscription_started_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Your Nowlez *{{1}}* plan is now active. You're all set — we'll keep tracking your cases and alert you here on every update.
        variables:
          - { name: tier, position: 1, location: body }
      hi:
        body: |
          आपका Nowlez *{{1}}* प्लान अब सक्रिय है। आप तैयार हैं — हम आपके केसों को ट्रैक करते रहेंगे और हर अपडेट पर आपको यहीं सूचित करेंगे।
        variables:
          - { name: tier, position: 1, location: body }

  # 17. renewal_success — case_billing.shared.webhook_router (renewal charged)
  - name: renewal_success_v1
    full_name: nowlez_renewal_success_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Your Nowlez *{{1}}* plan has renewed successfully. Thank you for staying with us — your case alerts continue uninterrupted.
        variables:
          - { name: tier, position: 1, location: body }
      hi:
        body: |
          आपका Nowlez *{{1}}* प्लान सफलतापूर्वक नवीनीकृत हो गया है। हमारे साथ बने रहने के लिए धन्यवाद — आपके केस अलर्ट बिना रुकावट जारी रहेंगे।
        variables:
          - { name: tier, position: 1, location: body }

  # 18. subscription_cancelled — case_billing.nowlez.cancellation
  - name: subscription_cancelled_v1
    full_name: nowlez_subscription_cancelled_v1
    category: UTILITY
    languages:
      en_US:
        body: |
          Your Nowlez plan is set to cancel on {{1}}. You'll keep full access until then. Changed your mind? You can reactivate anytime from your dashboard.
        variables:
          - { name: cancel_at, position: 1, location: body }
      hi:
        body: |
          आपका Nowlez प्लान {{1}} को रद्द होने वाला है। तब तक आपके पास पूरी सुविधा रहेगी। मन बदल गया? आप कभी भी अपने डैशबोर्ड से इसे पुनः सक्रिय कर सकते हैं।
        variables:
          - { name: cancel_at, position: 1, location: body }
