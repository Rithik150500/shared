[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp_delivery"
version = "0.1.0"
description = "Shared WhatsApp delivery client for Nowlez and Munshi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "redis>=5.0",
    "rq>=1.16",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "data_access",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
include = ["whatsapp_delivery*"]

# The template registry is YAML data files under templates/{nowlez,munshi}/.
# Without this, the wheel ships only the .py loader and the installed registry
# is EMPTY — every enqueue_send_template (registry path) raises TemplateNotFound.
# (The bot's low-level positional sends bypass the registry, which is why this
# went unnoticed.) Ship the data files so the registry loads in deployed images.
[tool.setuptools.package-data]
"whatsapp_delivery.templates" = ["*.yml", "nowlez/*.yml", "munshi/*.yml"]
