[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp_delivery"
version = "0.1.0"
description = "Shared WhatsApp delivery client for Nowlez and Munshi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "data_access",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
include = ["whatsapp_delivery*"]
