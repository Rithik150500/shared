[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identity"
version = "0.1.0"
description = "Shared identity layer (OTP + password + JWT) for Nowlez × Munshi"
requires-python = ">=3.11"
dependencies = [
    "data-access",
    "pyjwt[crypto]>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "pydantic-settings>=2.0",
    "sentry-sdk>=1.40,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "responses>=0.25", "freezegun>=1.4"]
