[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migrations"
version = "0.1.0"
description = "One-shot data migration scripts (re-fetch, schema cutover, etc.)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "data-access",
    "ecourts_client",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# Hatch's implicit layout would look for a nested ``migrations/migrations/``
# subdirectory; we want the package to BE this directory instead. Use the
# ``force-include`` mapping so the wheel ships ``migrations/`` as the package.
[tool.hatch.build.targets.wheel.force-include]
"." = "migrations"

[tool.hatch.build.targets.wheel]
exclude = [
    "tests",
    "tests/**",
    "*.md",
    "pyproject.toml",
]
